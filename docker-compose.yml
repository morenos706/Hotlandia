version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: contractus
      POSTGRES_PASSWORD: contractus
      POSTGRES_DB: contractus360
    ports:
      - '5432:5432'
    volumes:
      - contractus_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U contractus']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://contractus:contractus@postgres:5432/contractus360?schema=public
      JWT_SECRET: change-me-in-production
      JWT_REFRESH_SECRET: change-me-too
      CORS_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /app/uploads
      PORT: 3001
    ports:
      - '3001:3001'
    volumes:
      - contractus_uploads:/app/uploads

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    ports:
      - '3000:3000'

volumes:
  contractus_pgdata:
  contractus_uploads:
